# =============================================================================
# INFRASTRUCTURE CONFIGURATION: application.properties
# Microservicio de Vehículos (FleetOps - Core Environment Engine)
# Core Framework: Spring Boot 3.3.5 | Migration Engine: Flyway 10.x (Baseline)
# Environment Profile: Local Development (Agnostic Dev Spec)
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 1: CONFIGURACIÓN DEL SERVIDOR WEB
# ─────────────────────────────────────────────────────────────────────────────
server.port=8081
# server.port: Define el puerto TCP dedicado en el host local. Aísla el tráfico 
# de este contenedor para evitar colisiones de red con la puerta de enlace (API Gateway).

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 2: SUBSISTEMA DE PERSISTENCIA - DATA SOURCE CONTROLLER (PostgreSQL)
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fleetops_vehicles}
spring.datasource.username=${DB_USERNAME:fleetops}
spring.datasource.password=${DB_PASSWORD:fleetops123}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# Paginación: evita que un cliente pida páginas enormes y sature memoria/CPU.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=50

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 3: CAPA ORM (JPA / HIBERNATE 6.x SPECIFICATIONS)
# ─────────────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
# ─────────────────────────────────────────────────────────────────────────────
# CONCEPTO OPERATIVO: Absolute DDL Governance (Gobernanza Estricta del Esquema)
#
# ¿Por qué ddl-auto=none?
# Permitir que el motor de Hibernate modifique el esquema físico en caliente al arrancar 
# la aplicación ('update' o 'create') destruye el control de versiones de datos. Provoca 
# discrepancias criptográficas y estructurales con la tabla 'flyway_schema_history'. 
# Al configurarlo en 'none', se le quita el control a Hibernate, forzando a que cada 
# alteración del DDL se realice exclusivamente mediante scripts inmutables de Flyway.
# ─────────────────────────────────────────────────────────────────────────────

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
# format_sql / show-sql: Vuelca de forma estructurada en la consola las sentencias JPQL 
# traducidas a dialecto nativo SQL. Vital para auditar los JOINS de lectura en desarrollo.

spring.jpa.open-in-view=false
# ─────────────────────────────────────────────────────────────────────────────
# CONCEPTO OPERATIVO: Anti-Pattern Mitigation (Desactivación del Patrón OSIV)
#
# Lógica técnica: Por defecto, Spring mantiene la conexión a la base de datos abierta 
# durante toda la petición HTTP (hasta la renderización del JSON en el controlador), 
# permitiendo perezosamente consultas 'Lazy' en capas externas. Desactivar 'open-in-view' 
# (false) cierra la transacción y devuelve la conexión al pool (HikariCP) inmediatamente 
# al salir de la capa de servicios ('VehicleServiceImpl'). Esto reduce drásticamente la 
# latencia del pool y evita la fuga silenciosa de conexiones bajo ráfagas de tráfico masivo.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 4: MOTOR DE EVOLUCIÓN DETALLES FLYWAY (Flyway 10.x Compliance)
# ─────────────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
# validate-on-migrate: Ejecuta un check hash perimetral al arrancar. Comprueba que las 
# migraciones ya aplicadas en la base de datos no hayan sido editadas localmente en Java, 
# garantizando la consistencia absoluta de los entornos CI/CD antes de escribir datos.

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 5: CAPA CRIPTOGRÁFICA DE CONTROL (Security JWT Properties)
# ─────────────────────────────────────────────────────────────────────────────
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 6: TELEMETRÍA E INSTRUMENTACIÓN INDUSTRIAL (Spring Boot Actuator)
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
# Prometheus Export Compliance: Formatea y expone las métricas recolectadas por Micrometer 
# bajo el estándar abierto legible por raspadores (scrapers) concurrentes de Prometheus Core.

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 7: DOCUMENTACIÓN VIVA DE CONTRATOS (OpenAPI / Swagger Engine)
# ─────────────────────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─────────────────────────────────────────────────────────────────────────────
# SECCIÓN 8: TRAZAS DE SISTEMA Y DIAGNÓSTICO (Logging Controller Layer)
# ─────────────────────────────────────────────────────────────────────────────
logging.level.com.fleetops.vehicles=INFO
logging.level.org.springframework.web=INFO
logging.level.org.flywaydb=INFO
logging.level.com.fleetops.vehicles.security.JwtValidationFilter=DEBUG

#==============================================================================
# KAFKA
#==============================================================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:vehicles-service}
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Producer transaccional (contrato A+ — atomicidad DB + Kafka)
fleetops.kafka.producer.transaction-id-prefix=${KAFKA_PRODUCER_TRANSACTION_ID_PREFIX:vehicles-tx-}

# Reconciliación saga: reservas CONFIRMADA sin ACK de Asignaciones
fleetops.saga.reconciliacion.gracia-minutos=${SAGA_RECON_GRACIA_MIN:30}
fleetops.saga.reconciliacion.compensar-despues-minutos=${SAGA_RECON_COMPENSAR_MIN:240}
fleetops.saga.reconciliacion.max-reconfirmaciones=${SAGA_RECON_MAX_REINTENTOS:3}
fleetops.saga.reconciliacion.intervalo-ms=${SAGA_RECON_INTERVALO_MS:900000}

#==============================================================================
# SQS — Incidentes (SNS fan-out → queue_vehicles)
# Deshabilitado por defecto en local; activar con SQS_ENABLED=true en AWS.
#==============================================================================
fleetops.sqs.enabled=${SQS_ENABLED:false}
fleetops.sqs.incidents.queue-url=${SQS_VEHICLES_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/255615880629/queue_vehicles}
fleetops.sqs.incidents.event-type=${SQS_INCIDENTS_EVENT_TYPE:incident_registered}

spring.cloud.aws.region.static=${AWS_REGION:us-east-1}
spring.cloud.aws.sqs.enabled=${fleetops.sqs.enabled}
spring.cloud.aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
spring.cloud.aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}
