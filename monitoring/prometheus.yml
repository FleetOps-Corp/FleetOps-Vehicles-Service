# Dojo Prometheus & Grafana — scrape targets en EC2 (Elastic IP)
# Prometheus corre en local; editar targets si cambia la IP del servidor.
#
# NOTA DE SEGURIDAD (auditoria DevOps):
# Este archivo NO esta referenciado por docker-compose.yml, el Dockerfile ni
# ningun workflow de GitHub Actions -- no forma parte de ningun pipeline
# automatizado actual. Antes contenia una IP publica real (Elastic IP de
# AWS) hardcodeada, lo cual exponia informacion de infraestructura (IP +
# puertos internos activos) en el historial de git. Se reemplazo por un
# placeholder <EC2_HOST>. Prometheus no soporta variables de entorno
# nativamente en su config YAML, asi que antes de usar este archivo contra
# una instancia real hay que:
#   1. Reemplazar manualmente <EC2_HOST> por la IP/hostname real, o
#   2. Generar este archivo desde una plantilla con `envsubst` en el momento
#      de desplegar Prometheus (recomendado si se automatiza a futuro).
# No commitear nunca la IP real de produccion en texto plano.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: ec2-node
    static_configs:
      - targets: ['<EC2_HOST>:19100']

  - job_name: ec2-docker
    static_configs:
      - targets: ['<EC2_HOST>:18080']

  - job_name: api-metrics
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['<EC2_HOST>:18000']
