# =============================================================================
# docker-compose.yml - FleetOps Vehicles
# Entorno de desarrollo local, pensado para evolucionar a producción cambiando
# solo variables de entorno / overrides, no la estructura del compose.
# =============================================================================

networks:
  fleetops-network:
    name: fleetops-network
    driver: bridge

volumes:
  postgres-data:
    name: fleetops-vehicles-postgres-data

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 - Base de datos del microservicio
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: fleetops-vehicles-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fleetops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------
  # Volumen que contiene el archivo de la llave publica
  # ------------------------------------------------------------------
  
  api_gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    volumes:
      - ./api_gateway:/app
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro #aqui es donde se agrega el volumen
    container_name: fleetops_api_gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      ROLE_SERVICE_URL: ${ROLE_SERVICE_URL}
      JWT_ALGORITHM: ${JWT_ALGORITHM} # aqui esta el algoritmo de encriptacion
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem # aqui esta la ruta de la llave publica
      GATEWAY_RATE_LIMIT: ${GATEWAY_RATE_LIMIT}
      GATEWAY_PORT: ${GATEWAY_PORT}
      VEHICLES_SERVICE_URL: ${VEHICLES_SERVICE_URL}
      ASSIGNMENTS_SERVICE_URL: ${ASSIGNMENTS_SERVICE_URL}
      INCIDENTS_SERVICE_URL: ${INCIDENTS_SERVICE_URL}
      MAINTENANCE_SERVICE_URL: ${MAINTENANCE_SERVICE_URL}
      REPORTS_SERVICE_URL: ${REPORTS_SERVICE_URL}
      LOG_LEVEL: ${LOG_LEVEL}
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    networks:
      - fleetops_security_net
    depends_on:
      auth_service:
        condition: service_healthy
      role_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${GATEWAY_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s





  # ---------------------------------------------------------------------------
  # Kafka - comunicación por eventos con asignaciones
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: fleetops-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - fleetops-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fleetops-kafka-ui
    ports:
      - "8082:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: fleetops
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - fleetops-network

  # ---------------------------------------------------------------------------
  # vehicles-service - Microservicio Spring Boot (construido desde el Dockerfile)
  # ---------------------------------------------------------------------------
  vehicles-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: fleetops/vehicles-service:local
    container_name: fleetops-vehicles-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      # Puerto interno del contenedor (siempre 8081). API_HOST_PORT expone otro puerto en el host.
      SERVER_PORT: "8081"
      JWT_SECRET: ${JWT_SECRET_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MAINTENANCE_SERVICE_URL: ${MAINTENANCE_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SHOW_SQL: ${SHOW_SQL}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Override explícito de Spring Boot (relaxed binding) para forzar la
      # conexión al servicio "postgres" de esta red Docker, ya que
      # application.properties trae spring.datasource.url hardcodeado a
      # localhost y no usa placeholders de DB_HOST/DB_PORT.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${API_HOST_PORT:-8081}:8081"
    networks:
      - fleetops-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    
