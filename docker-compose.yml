# =============================================================================
# docker-compose.yml - FleetOps Vehicles
# Entorno de desarrollo local, pensado para evolucionar a producción cambiando
# solo variables de entorno / overrides, no la estructura del compose.
# =============================================================================

networks:
  fleetops-network:
    name: fleetops-network
    driver: bridge

volumes:
  postgres-data:
    name: fleetops-vehicles-postgres-data

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL 15 - Base de datos del microservicio
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: fleetops-vehicles-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fleetops-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Kafka local únicamente para desarrollo.
  # En producción/integración el microservicio puede conectarse
  # al broker del microservicio de Asignaciones mediante
  # KAFKA_BOOTSTRAP_SERVERS.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: fleetops-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - fleetops-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fleetops-kafka-ui
    ports:
      - "8082:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: fleetops
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - fleetops-network

  # ---------------------------------------------------------------------------
  # LocalStack — SNS/SQS local para Incidentes y Mantenimiento
  # Ver docs/localstack-sqs.md y scripts/localstack/
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:3
    container_name: fleetops-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,sns
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - ./localstack/init:/etc/localstack/init
    networks:
      - fleetops-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------------
  # vehicles-service - Microservicio Spring Boot (construido desde el Dockerfile)
  # ---------------------------------------------------------------------------
  vehicles-service:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    image: fleetops/vehicles-service:local
    container_name: fleetops-vehicles-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      localstack:
        condition: service_healthy
        required: false
    environment:
      # Puerto interno del contenedor (siempre 8081). API_HOST_PORT expone otro puerto en el host.
      SERVER_PORT: "8081"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      MAINTENANCE_SERVICE_URL: ${MAINTENANCE_SERVICE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SHOW_SQL: ${SHOW_SQL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SQS_ENABLED: ${SQS_ENABLED:-true}
      # Local: http://localstack:4566 (ver AWS_ENDPOINT_URL_CONTAINER en .env)
      # EC2/AWS: vacío → SDK usa endpoints reales de AWS (IAM Role en la instancia)
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL_CONTAINER-http://localstack:4566}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY-}
      SQS_VEHICLES_QUEUE_URL: ${SQS_VEHICLES_QUEUE_URL:-http://localstack:4566/000000000000/queue_vehicles}
      MAINTENANCE_SQS_QUEUE_URL: ${MAINTENANCE_SQS_QUEUE_URL:-http://localstack:4566/000000000000/queue_vehicles_maintenance}
      JAVA_OPTS: ${JAVA_OPTS:-}
    ports:
      - "${API_HOST_PORT:-8081}:8081"
    networks:
      - fleetops-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
